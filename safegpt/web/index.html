<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B35" />
    <title>SafeGPT – Construction H&S AI</title>
    <style>
      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
      * { box-sizing: border-box; touch-action: manipulation; }
      html, body, #root { margin: 0; padding: 0; height: 100%; min-height: 100dvh; width: 100%; overflow: hidden; }
      body { background: #0f172a; max-width: 100%; overflow-x: hidden; }
      input, textarea, select { font-size: 16px !important; }
      [data-testid], p, span { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
